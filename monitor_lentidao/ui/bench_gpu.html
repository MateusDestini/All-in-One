  <span id="placa" style="color:#aaa"></span><div class="barra"><div id="barra"></div></div></div>
<div class="dica">Esc ou fechar a janela cancela · não minimize durante o teste</div>
<script>
// Configuração colocada pelo monitor.
const CFG = /*CONFIG*/null || {largura: 640, altura: 360, qualidade: "alta", cenas: ["jogo", "rt"], aquecer: 3, passadas: 3, duracao: 8};
const api = () => window.pywebview && window.pywebview.api;
const QUAL = {
  normal:  {terreno: 256, arvores: 12000, sombra: 2048, msaa: 0, spp: 1, rebatidas: 2},
  alta:    {terreno: 384, arvores: 30000, sombra: 2048, msaa: 4, spp: 2, rebatidas: 3},
  extrema: {terreno: 512, arvores: 60000, sombra: 4096, msaa: 4, spp: 4, rebatidas: 4},
}[CFG.qualidade] || null;
const NOMES = {jogo: "Cena de jogo", rt: "Ray tracing"};
const AGUA = 2.0, TAM = 800;
const SOL = norm([0.55, 0.62, 0.32]);

function norm(v) { const l = Math.hypot(v[0], v[1], v[2]); return [v[0] / l, v[1] / l, v[2] / l]; }

// ------------------------------------------------------------------ matrizes (coluna principal, como o OpenGL)
const M = {
  persp(fovy, asp, n, f) { const t = 1 / Math.tan(fovy / 2), r = new Float32Array(16);
    r[0] = t / asp; r[5] = t; r[10] = (f + n) / (n - f); r[11] = -1; r[14] = 2 * f * n / (n - f); return r; },
  orto(l, d, b, t, n, f) { const r = new Float32Array(16);
    r[0] = 2 / (d - l); r[5] = 2 / (t - b); r[10] = -2 / (f - n); r[12] = -(d + l) / (d - l); r[13] = -(t + b) / (t - b); r[14] = -(f + n) / (f - n); r[15] = 1; return r; },
  olhar(o, a, up) {
    const z = norm([o[0] - a[0], o[1] - a[1], o[2] - a[2]]);
    const x = norm([up[1] * z[2] - up[2] * z[1], up[2] * z[0] - up[0] * z[2], up[0] * z[1] - up[1] * z[0]]);
    const y = [z[1] * x[2] - z[2] * x[1], z[2] * x[0] - z[0] * x[2], z[0] * x[1] - z[1] * x[0]];
    const r = new Float32Array(16);
    r[0] = x[0]; r[4] = x[1]; r[8] = x[2]; r[1] = y[0]; r[5] = y[1]; r[9] = y[2]; r[2] = z[0]; r[6] = z[1]; r[10] = z[2];
    r[12] = -(x[0] * o[0] + x[1] * o[1] + x[2] * o[2]); r[13] = -(y[0] * o[0] + y[1] * o[1] + y[2] * o[2]);
    r[14] = -(z[0] * o[0] + z[1] * o[1] + z[2] * o[2]); r[15] = 1; return r;
  },
  mul(a, b) { const r = new Float32Array(16);
    for (let i = 0; i < 4; i++) for (let j = 0; j < 4; j++) { let s = 0; for (let k = 0; k < 4; k++) s += a[k * 4 + j] * b[i * 4 + k]; r[i * 4 + j] = s; }
    return r; },
};

// ------------------------------------------------------------------ terreno (CPU): ruído fractal com um vale e um rio
function hash2(x, z) { let h = Math.imul(x | 0, 374761393) + Math.imul(z | 0, 668265263); h = Math.imul(h ^ (h >>> 13), 1274126177); return ((h ^ (h >>> 16)) >>> 0) / 4294967296; }
function ruido2(x, z) {
  const xi = Math.floor(x), zi = Math.floor(z), fx = x - xi, fz = z - zi, u = fx * fx * (3 - 2 * fx), v = fz * fz * (3 - 2 * fz);
  const a = hash2(xi, zi), b = hash2(xi + 1, zi), c = hash2(xi, zi + 1), d = hash2(xi + 1, zi + 1);
  return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
}
const rioX = z => Math.sin(z * 0.008) * 110;
function altura(x, z) {
  let h = 0, amp = 1, fr = 0.0055;
  for (let o = 0; o < 6; o++) { h += amp * ruido2(x * fr + o * 31.7, z * fr - o * 17.3); amp *= 0.5; fr *= 2.07; }
  h = 8 + (h - 0.95) * 85;
  const vale = Math.min(1, Math.abs(x - rioX(z)) / 85);
  return h * (0.12 + 0.88 * vale * vale) - (1 - vale) * 5;
}
function semente(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

// ------------------------------------------------------------------ GLSL comum
const RUIDO_GLSL = `
float h21(vec2 p) { p = fract(p * vec2(123.34, 456.21)); p += dot(p, p + 45.32); return fract(p.x * p.y); }
float r2(vec2 p) { vec2 i = floor(p), f = fract(p); f = f * f * (3.0 - 2.0 * f);
  return mix(mix(h21(i), h21(i + vec2(1, 0)), f.x), mix(h21(i + vec2(0, 1)), h21(i + vec2(1, 1)), f.x), f.y); }
float fbm2(vec2 p, int n) { float s = 0.0, a = 0.5; for (int i = 0; i < 6; i++) { if (i >= n) break; s += a * r2(p); p = p * 2.03 + 3.1; a *= 0.5; } return s; }`;
const LUZ_GLSL = `
uniform vec3 sol; uniform vec3 cam; uniform highp sampler2DShadow sombra; uniform float texel;
const vec3 SOL_COR = vec3(3.1, 2.85, 2.45);
const vec3 CEU_AMB = vec3(0.30, 0.40, 0.55);
float sombraPcf(vec4 l) {
  vec3 p = l.xyz / l.w * 0.5 + 0.5;
  if (p.x < 0.0 || p.x > 1.0 || p.y < 0.0 || p.y > 1.0 || p.z > 1.0) return 1.0;
  float s = 0.0;
  for (int y = -1; y <= 1; y++) for (int x = -1; x <= 1; x++) s += texture(sombra, vec3(p.xy + vec2(x, y) * texel, p.z - 0.0012));
  return s / 9.0;
}
vec3 corNeblina(vec3 rd) { return mix(vec3(0.55, 0.66, 0.80), vec3(1.25, 1.0, 0.7), pow(max(dot(rd, sol), 0.0), 8.0)); }
vec3 neblina(vec3 c, vec3 p) { vec3 d = p - cam; float f = 1.0 - exp(-length(d) * 0.0024); return mix(c, corNeblina(normalize(d)), f); }`;
const CEU_GLSL = `
vec3 ceu(vec3 rd, float t) {
  float y = max(rd.y, 0.0);
  vec3 c = mix(vec3(0.62, 0.72, 0.85), vec3(0.20, 0.38, 0.72), pow(y, 0.55));
  float s = max(dot(rd, sol), 0.0);
  c += vec3(1.0, 0.8, 0.55) * pow(s, 12.0) * 0.6 + vec3(30.0, 26.0, 20.0) * smoothstep(0.9993, 0.9997, s);
  if (rd.y > 0.01) {
    vec2 q = rd.xz / rd.y * 0.8 + vec2(t * 0.012, 0.0);
    float n = fbm2(q * 1.4, 5);
    float nuvem = smoothstep(0.48, 0.78, n) * smoothstep(0.0, 0.12, rd.y);
    c = mix(c, vec3(1.05, 1.02, 1.0) * (0.75 + 0.35 * s), nuvem * 0.85);
  }
  return c;
}`;

const VS_TERRENO = `#version 300 es
layout(location=0) in vec3 pos; layout(location=1) in vec3 nor;
uniform mat4 vp; uniform mat4 luzVP;
out vec3 vP; out vec3 vN; out vec4 vLuz;
void main() { vP = pos; vN = nor; vLuz = luzVP * vec4(pos, 1.0); gl_Position = vp * vec4(pos, 1.0); }`;
const FS_TERRENO = `#version 300 es
precision highp float;
in vec3 vP; in vec3 vN; in vec4 vLuz; out vec4 cor;
${RUIDO_GLSL}${LUZ_GLSL}
void main() {
  vec3 n = normalize(vN);
  float det = fbm2(vP.xz * 0.18, 4), incl = 1.0 - n.y;
  vec3 grama = mix(vec3(0.10, 0.20, 0.05), vec3(0.24, 0.32, 0.09), det);
  vec3 rocha = mix(vec3(0.26, 0.24, 0.22), vec3(0.44, 0.41, 0.37), det);
  vec3 a = mix(grama, rocha, smoothstep(0.22, 0.42, incl + det * 0.12));
  a = mix(vec3(0.58, 0.52, 0.38), a, smoothstep(${AGUA.toFixed(1)} + 0.4, ${AGUA.toFixed(1)} + 2.5, vP.y + det));
  a = mix(a, vec3(0.92, 0.94, 0.98), smoothstep(50.0, 62.0, vP.y + det * 10.0) * (1.0 - smoothstep(0.35, 0.6, incl)));
  vec3 luz = SOL_COR * max(dot(n, sol), 0.0) * sombraPcf(vLuz) + CEU_AMB * (0.55 + 0.45 * n.y);
  cor = vec4(neblina(a * luz, vP), 1.0);
}`;
const VS_ARVORE = `#version 300 es
layout(location=0) in vec3 pos; layout(location=1) in vec3 nor; layout(location=2) in float folha;
layout(location=3) in vec4 inst; layout(location=4) in vec2 inst2;
uniform mat4 vp; uniform mat4 luzVP; uniform float t;
out vec3 vP; out vec3 vN; out vec4 vLuz; out float vFolha; out float vTom;
void main() {
  float c = cos(inst2.x), s = sin(inst2.x);
  mat2 g = mat2(c, -s, s, c);
  vec3 p = pos * inst.w; p.xz = g * p.xz;
  p.x += sin(t * 1.7 + inst.x * 0.13 + inst.z * 0.11) * 0.035 * p.y * folha;
  vec3 w = p + inst.xyz, n = nor; n.xz = g * n.xz;
  vP = w; vN = n; vFolha = folha; vTom = inst2.y; vLuz = luzVP * vec4(w, 1.0);
  gl_Position = vp * vec4(w, 1.0);
}`;
const FS_ARVORE = `#version 300 es
precision highp float;
in vec3 vP; in vec3 vN; in vec4 vLuz; in float vFolha; in float vTom; out vec4 cor;
${LUZ_GLSL}
void main() {
  vec3 n = normalize(vN);
  vec3 a = mix(vec3(0.22, 0.14, 0.08), mix(vec3(0.05, 0.16, 0.06), vec3(0.14, 0.24, 0.06), vTom), vFolha);
  float nl = max(dot(n, sol), 0.0) * 0.8 + 0.2 * vFolha;
  vec3 luz = SOL_COR * nl * sombraPcf(vLuz) + CEU_AMB * (0.5 + 0.5 * n.y);
  cor = vec4(neblina(a * luz, vP), 1.0);
}`;
const VS_AGUA = `#version 300 es
layout(location=0) in vec3 pos;
uniform mat4 vp; uniform mat4 luzVP;
out vec3 vP; out vec4 vLuz;
void main() { vP = pos; vLuz = luzVP * vec4(pos, 1.0); gl_Position = vp * vec4(pos, 1.0); }`;
const FS_AGUA = `#version 300 es
precision highp float;
in vec3 vP; in vec4 vLuz; out vec4 cor; uniform float t;
${RUIDO_GLSL}${LUZ_GLSL}${CEU_GLSL}
void main() {
  vec2 q = vP.xz;
  float e = 0.08;
  float h0 = fbm2(q * 0.11 + vec2(t * 0.20, t * 0.07), 5) + 0.5 * sin(q.x * 0.35 + t * 1.3) * sin(q.y * 0.27 - t * 0.9);
  float hx = fbm2((q + vec2(e, 0.0)) * 0.11 + vec2(t * 0.20, t * 0.07), 5) + 0.5 * sin((q.x + e) * 0.35 + t * 1.3) * sin(q.y * 0.27 - t * 0.9);
  float hz = fbm2((q + vec2(0.0, e)) * 0.11 + vec2(t * 0.20, t * 0.07), 5) + 0.5 * sin(q.x * 0.35 + t * 1.3) * sin((q.y + e) * 0.27 - t * 0.9);
  vec3 n = normalize(vec3(h0 - hx, e * 3.0, h0 - hz));
  vec3 v = normalize(vP - cam);
  float fres = 0.04 + 0.96 * pow(1.0 - max(dot(-v, n), 0.0), 5.0);
  float sh = sombraPcf(vLuz);
  vec3 refl = ceu(reflect(v, n), t) * (0.35 + 0.65 * sh);
  vec3 fundo = vec3(0.02, 0.07, 0.09) + vec3(0.03, 0.09, 0.08) * max(dot(n, sol), 0.0);
  vec3 c = mix(fundo, refl, fres) + SOL_COR * pow(max(dot(reflect(v, n), sol), 0.0), 220.0) * 2.5 * sh;
  cor = vec4(neblina(c, vP), 1.0);
}`;
const VS_TELA = `#version 300 es
layout(location=0) in vec2 p; out vec2 uv;
void main() { uv = p * 0.5 + 0.5; gl_Position = vec4(p, 0.0, 1.0); }`;
const VS_CEU = `#version 300 es
layout(location=0) in vec2 p; out vec2 uv;
void main() { uv = p; gl_Position = vec4(p, 1.0, 1.0); }`;
const FS_CEU = `#version 300 es
precision highp float;
in vec2 uv; out vec4 cor;
uniform vec3 frente, direita, cima; uniform float t;
${RUIDO_GLSL}${LUZ_GLSL}${CEU_GLSL}
void main() { vec3 rd = normalize(frente + uv.x * direita + uv.y * cima); cor = vec4(ceu(rd, t), 1.0); }`;
const FS_VAZIO = `#version 300 es
precision highp float; void main() {}`;
const FS_BRILHO = `#version 300 es
precision highp float;
in vec2 uv; out vec4 cor; uniform sampler2D img; uniform vec2 px;
void main() {
  vec3 c = texture(img, uv + px * vec2(-1, -1)).rgb + texture(img, uv + px * vec2(1, -1)).rgb
         + texture(img, uv + px * vec2(-1, 1)).rgb + texture(img, uv + px * vec2(1, 1)).rgb;
  cor = vec4(max(c * 0.25 - 1.0, 0.0), 1.0);
}`;
const FS_BORRAO = `#version 300 es
precision highp float;
in vec2 uv; out vec4 cor; uniform sampler2D img; uniform vec2 dir;
void main() {
  float w[5] = float[](0.227, 0.195, 0.122, 0.054, 0.016);
  vec3 c = texture(img, uv).rgb * w[0];
  for (int i = 1; i < 5; i++) c += (texture(img, uv + dir * float(i)).rgb + texture(img, uv - dir * float(i)).rgb) * w[i];
  cor = vec4(c, 1.0);
}`;
const FS_JUNTA = `#version 300 es
precision highp float;
in vec2 uv; out vec4 cor; uniform sampler2D hdr, brilho;
vec3 aces(vec3 x) { return clamp((x * (2.51 * x + 0.03)) / (x * (2.43 * x + 0.59) + 0.14), 0.0, 1.0); }
void main() {
  vec3 c = texture(hdr, uv).rgb + texture(brilho, uv).rgb * 0.55;
  c = aces(c * 0.85);
  vec2 d = uv - 0.5; c *= 1.0 - dot(d, d) * 0.55;
  cor = vec4(pow(c, vec3(1.0 / 2.2)), 1.0);
}`;
const FS_MOSTRA = `#version 300 es
precision highp float;
in vec2 uv; out vec4 cor; uniform sampler2D img;
void main() { cor = vec4(texture(img, uv).rgb, 1.0); }`;

// Ray tracing por shader: esferas, colunas (caixas) e piso; sombra suave do sol, oclusão de ambiente e rebatidas.
const NE = 40, NC = 8;
const FS_RT = `#version 300 es
precision highp float;
out vec4 cor;
uniform vec2 res; uniform float t; uniform int spp, rebatidas, quadro;
uniform vec4 esf[${NE}]; uniform vec4 esfMat[${NE}];
uniform vec3 cxMin[${NC}], cxMax[${NC}]; uniform vec4 cxMat[${NC}];
uniform vec3 ro0, frente, direita, cima;
const vec3 SOLD = normalize(vec3(0.5, 0.75, 0.35));
const vec3 SOL_COR = vec3(1.7, 1.55, 1.35);
uint semente;
float rnd() { semente = semente * 747796405u + 2891336453u; uint w = ((semente >> ((semente >> 28u) + 4u)) ^ semente) * 277803737u; return float((w >> 22u) ^ w) / 4294967295.0; }
vec3 rndEsfera() { return vec3(rnd(), rnd(), rnd()) - 0.5; }
vec3 cosDir(vec3 n) {
  float a = 6.2831853 * rnd(), r = rnd(), sr = sqrt(r);
  vec3 u = normalize(cross(abs(n.x) > 0.5 ? vec3(0, 1, 0) : vec3(1, 0, 0), n)), v = cross(n, u);
  return normalize(u * cos(a) * sr + v * sin(a) * sr + n * sqrt(1.0 - r));
}
vec3 ceuRt(vec3 rd) {
  vec3 c = mix(vec3(0.62, 0.68, 0.78), vec3(0.16, 0.30, 0.62), pow(max(rd.y, 0.0), 0.5));
  return c + vec3(12.0, 10.0, 8.0) * smoothstep(0.995, 0.998, dot(rd, SOLD));
}
bool caixa(vec3 ro, vec3 inv, vec3 mn, vec3 mx, float maxT, out float tt) {
  vec3 t0 = (mn - ro) * inv, t1 = (mx - ro) * inv, a = min(t0, t1), b = max(t0, t1);
  float tn = max(max(a.x, a.y), a.z), tf = min(min(b.x, b.y), b.z);
  tt = tn > 1e-3 ? tn : tf;
  return tf >= max(tn, 1e-3) && tt < maxT;
}
bool acerta(vec3 ro, vec3 rd, out float tt, out vec3 n, out vec4 m) {
  tt = 1e9;
  if (rd.y < -1e-5) {
    float tp = -ro.y / rd.y;
    if (tp > 1e-3) { tt = tp; n = vec3(0, 1, 0); vec3 p = ro + rd * tp;
      float x = mod(floor(p.x * 0.5) + floor(p.z * 0.5), 2.0); m = vec4(mix(vec3(0.62), vec3(0.12), x), 0.0); }
  }
  for (int i = 0; i < ${NE}; i++) {
    vec4 e = esf[i]; vec3 oc = ro - e.xyz; float b = dot(oc, rd), c = dot(oc, oc) - e.w * e.w, h = b * b - c;
    if (h > 0.0) { h = sqrt(h); float ti = -b - h; if (ti < 1e-3) ti = -b + h;
      if (ti > 1e-3 && ti < tt) { tt = ti; n = (ro + rd * ti - e.xyz) / e.w; m = esfMat[i]; } }
  }
  vec3 inv = 1.0 / rd;
  for (int i = 0; i < ${NC}; i++) {
    float tc;
    if (caixa(ro, inv, cxMin[i], cxMax[i], tt, tc)) {
      tt = tc; vec3 p = ro + rd * tc, c = (cxMin[i] + cxMax[i]) * 0.5, d = (p - c) / ((cxMax[i] - cxMin[i]) * 0.5), a = abs(d);
      n = a.x > a.y && a.x > a.z ? vec3(sign(d.x), 0, 0) : a.y > a.z ? vec3(0, sign(d.y), 0) : vec3(0, 0, sign(d.z));
      m = cxMat[i];
    }
  }
  return tt < 1e8;
}
bool bloqueado(vec3 ro, vec3 rd, float maxT) {
  if (rd.y < -1e-5 && -ro.y / rd.y < maxT) return true;
  for (int i = 0; i < ${NE}; i++) {
    vec4 e = esf[i]; vec3 oc = ro - e.xyz; float b = dot(oc, rd), c = dot(oc, oc) - e.w * e.w, h = b * b - c;
    if (h > 0.0) { h = sqrt(h); float ti = -b - h; if (ti < 1e-3) ti = -b + h; if (ti > 1e-3 && ti < maxT && esfMat[i].w < 2.5) return true; }
  }
  vec3 inv = 1.0 / rd;
  for (int i = 0; i < ${NC}; i++) { float tc; if (caixa(ro, inv, cxMin[i], cxMax[i], maxT, tc)) return true; }
  return false;
}
vec3 aces(vec3 x) { return clamp((x * (2.51 * x + 0.03)) / (x * (2.43 * x + 0.59) + 0.14), 0.0, 1.0); }
void main() {
  semente = (uint(gl_FragCoord.x) * 1973u + uint(gl_FragCoord.y) * 9277u + uint(quadro) * 26699u) | 1u;
  vec3 soma = vec3(0.0);
  for (int s = 0; s < 16; s++) {
    if (s >= spp) break;
    vec2 uv = (gl_FragCoord.xy + vec2(rnd(), rnd()) - 0.5 - 0.5 * res) / res.y;
    vec3 rd = normalize(frente + uv.x * direita + uv.y * cima), ro = ro0, peso = vec3(1.0), acc = vec3(0.0);
    for (int b = 0; b < 8; b++) {
      if (b >= rebatidas) break;
      float tt; vec3 n; vec4 m;
      if (!acerta(ro, rd, tt, n, m)) { acc += peso * ceuRt(rd); break; }
      vec3 p = ro + rd * tt;
      if (m.w > 2.5) { acc += peso * m.rgb * 5.0; break; }
      if (dot(n, rd) > 0.0) n = -n;
      vec3 o = p + n * 2e-3;
      vec3 ls = normalize(SOLD + rndEsfera() * 0.06);
      float nl = max(dot(n, ls), 0.0);
      float vis = nl > 0.0 && !bloqueado(o, ls, 1e6) ? 1.0 : 0.0;
      float ao = bloqueado(o, cosDir(n), 2.5) ? 0.3 : 1.0;
      vec3 direto = SOL_COR * nl * vis + vec3(0.22, 0.27, 0.36) * ao;
      if (m.w < 0.5) { acc += peso * m.rgb * direto; peso *= m.rgb; rd = cosDir(n); }

  const f = norm([a[0] - o[0], a[1] - o[1], a[2] - o[2]]), d = norm([-f[2], 0, f[0]]);
  const up = [d[1] * f[2] - d[2] * f[1], d[2] * f[0] - d[0] * f[2], d[0] * f[1] - d[1] * f[0]], tg = Math.tan(0.95 / 2) * 2;
  gl.bindFramebuffer(gl.FRAMEBUFFER, final.fbo); gl.viewport(0, 0, W, H);
  gl.disable(gl.DEPTH_TEST); gl.disable(gl.BLEND);
  const pu = c.pr.u; gl.useProgram(c.pr.p);
  gl.uniform2f(pu.res, W, H); gl.uniform1f(pu.t, t); gl.uniform1i(pu.spp, QUAL.spp); gl.uniform1i(pu.rebatidas, QUAL.rebatidas);
  gl.uniform1i(pu.quadro, quadroN++);
  gl.uniform4fv(pu.esf, c.esf); gl.uniform4fv(pu.esfMat, c.mat);
  gl.uniform3fv(pu.cxMin, c.cxMin); gl.uniform3fv(pu.cxMax, c.cxMax); gl.uniform4fv(pu.cxMat, c.cxMat);
  gl.uniform3fv(pu.ro0, o); gl.uniform3fv(pu.frente, f); gl.uniform3fv(pu.direita, d.map(x => x * tg)); gl.uniform3fv(pu.cima, up.map(x => x * tg));
  desenharTela();
}
function descreverRt() { return `${QUAL.spp} amostra${QUAL.spp > 1 ? "s" : ""} por pixel · ${QUAL.rebatidas} rebatidas · ${NE + NC + 1} objetos`; }

// ------------------------------------------------------------------ medição
// Fases por cena: aquecimento (não conta) e N passadas iguais. Cada quadro é desenhado fora da tela e sincronizado
// (readPixels de 1 pixel), então o tempo de cada quadro é medido sem o limite do V-Sync.
let cenaI = 0, fase = "aquecendo", passada = 0, inicioFase = 0, tempos = [], resultados = [], feitoSeg = 0, ultimoRelato = 0, perdeu = false;
let janela = {q: 0, ms: 0}, fpsTela = 0;
const totalSeg = CFG.cenas.length * (CFG.aquecer + CFG.passadas * CFG.duracao);
const cenaAtual = () => CFG.cenas[cenaI];

function prepararCena() {
  const c = cenaAtual();
  try {
    if (c === "jogo" && !jogo) jogo = prepararJogo();
    if (c === "rt" && !rt) rt = prepararRt();
  } catch (e) { falhar("Não deu para preparar a cena: " + e.message); return false; }
  document.getElementById("cena").textContent = NOMES[c];
  document.getElementById("info").textContent = `${CFG.largura}×${CFG.altura} · ${c === "jogo" ? descreverJogo() : descreverRt()}`;
  fase = CFG.aquecer > 0 ? "aquecendo" : "medindo"; passada = CFG.aquecer > 0 ? 0 : 1; inicioFase = performance.now(); tempos = [];
  return true;
}
function duracaoFase() { return fase === "aquecendo" ? CFG.aquecer : CFG.duracao; }
function fecharPassada() {
  const soma = tempos.reduce((a, b) => a + b, 0), ord = [...tempos].sort((a, b) => b - a);
  const lentos = ord.slice(0, Math.max(1, Math.round(ord.length / 100)));
  const mediaLentos = lentos.reduce((a, b) => a + b, 0) / lentos.length;
  return {fps: tempos.length * 1000 / soma, low1: 1000 / mediaLentos, quadros: tempos.length, ms_max: ord[0]};
}
function avancar(agora) {
  if ((agora - inicioFase) / 1000 < duracaoFase()) return false;
  feitoSeg += duracaoFase();
  if (fase === "medindo") {
    resultados.push(fecharPassada());
    if (passada >= CFG.passadas) {
      const c = cenaAtual(), a = api();
      const dados = {passadas: resultados, largura: CFG.largura, altura: CFG.altura, qualidade: CFG.qualidade, renderizador,
        detalhe: c === "jogo" ? descreverJogo() : descreverRt(), rpp: c === "rt" ? rt.rpp : 0};
      if (!a) console.log("resultado", c, JSON.stringify(dados));
      const envio = a ? Promise.resolve(a.resultado(c, dados)) : Promise.resolve();
      resultados = []; cenaI++;
      if (cenaI >= CFG.cenas.length) {
        parado = true; relatar(agora, true);
        envio.finally(() => { if (a) a.concluir(); else document.title = "concluido"; });
        return true;
      }
      return !prepararCena();
    }
  }
  fase = "medindo"; passada++; inicioFase = performance.now(); tempos = [];
  return true;
}
function relatar(agora, fim) {
  const pct = fim ? 1 : Math.min(1, (feitoSeg + Math.min(duracaoFase(), (agora - inicioFase) / 1000)) / totalSeg);
  document.getElementById("barra").style.width = (pct * 100).toFixed(1) + "%";
  if (janela.q) fpsTela = janela.q * 1000 / janela.ms;
  document.getElementById("fps").textContent = janela.q ? Math.round(fpsTela) : "—";
  const a = api();
  if (a) a.progresso({cena: cenaAtual() || "", fase: fim ? "fim" : fase, passada, passadas: CFG.passadas, fps: fpsTela, pct});
  janela = {q: 0, ms: 0};
}
function mostrar() {
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  const lw = tela.width, la = tela.height, esc = Math.min(lw / CFG.largura, la / CFG.altura);
  const w = Math.round(CFG.largura * esc), h = Math.round(CFG.altura * esc);
  gl.viewport((lw - w) >> 1, (la - h) >> 1, w, h);
  gl.useProgram(final.mostra.p); gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, final.tex); gl.uniform1i(final.mostra.u.img, 0);
  desenharTela();
}
function laco() {
  if (parado) return;
  if (perdeu) { perdeu = false; inicioFase = performance.now(); tempos = []; }
  const limite = performance.now() + 30;
  try {
    do {
      const t0 = performance.now(), t = (t0 - inicioFase) / 1000;
      if (cenaAtual() === "jogo") quadroJogo(t, CFG.duracao); else quadroRt(t, CFG.duracao);
      gl.readPixels(0, 0, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, pixel);
      const t1 = performance.now();
      if (fase === "medindo") tempos.push(t1 - t0);
      janela.q++; janela.ms += t1 - t0;
      if (avancar(t1) || parado) break;
    } while (performance.now() < limite);
    const e = gl.getError();
    if (e !== gl.NO_ERROR && e !== gl.CONTEXT_LOST_WEBGL) throw new Error("erro do WebGL " + e);
  } catch (e) { falhar("A placa de vídeo falhou durante o teste: " + e.message); return; }
  if (parado) { mostrar(); return; }
  mostrar();
  const agora = performance.now();
  if (agora - ultimoRelato > 400) { relatar(agora, false); ultimoRelato = agora; }
  requestAnimationFrame(laco);
}
// Janela minimizada ou escondida: o navegador para de desenhar. A passada em andamento recomeça quando voltar.
document.addEventListener("visibilitychange", () => { if (document.hidden) perdeu = true; });
document.addEventListener("keydown", e => { if (e.key === "Escape") { const a = api(); if (a) a.fechar(); } });
function ajustarTela() { tela.width = Math.max(1, Math.round(innerWidth * devicePixelRatio)); tela.height = Math.max(1, Math.round(innerHeight * devicePixelRatio)); }
window.addEventListener("resize", ajustarTela);

function iniciar() {
  if (!QUAL) return falhar("Qualidade desconhecida.");
  ajustarTela();
  try { prepararBase(); } catch (e) { return falhar(e.message); }
  if (!prepararCena()) return;
  requestAnimationFrame(laco);
}
iniciar();
</script>
